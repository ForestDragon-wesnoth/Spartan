#textdomain wesnoth-units

#tougher than average for a lvl3 ranged unit and is able to heal nearby enemies, but immobile

[unit_type]
    id=Hoplite_Dark_Flame_Spire
    name= _ "Dark Flame Spire"
    race=mechanical
    {TRAIT_UNHOLY}
    image="units/domain/spire-purple-fire.png"
    hitpoints=50
    movement_type=spartanfoot
    movement=0
    experience=99
    level=3
    alignment=neutral
    advances_to=null
    #    {AMLA_DEFAULT}
    cost=12
    usage=fighter
    description= _ "TODO"
    die_sound=lich-die.ogg
    {DEFENSE_ANIM "units/domain/spire-purple-fire.png" "units/domain/spire-purple-fire.png" staff.ogg}
    [abilities]
        {ABILITY_SPARTAN_HEALS 5}
        {ABILITY_HOPLITE_KNOCKBACKIMMUNE}
#not needed to make enemies approach healer, only for moving the healer himself. and spires are immobile
#        {ABILITY_SPARTAN_HEALER_AI}
#        {ABILITY_SPARTAN_HEALER_RETREAT_AI}
    [/abilities]
    [death]
        start_time=0
        [frame]
            image="misc/blank-hex.png"
            halo="misc/blank-hex.png:1,projectiles/fireball-impact-[1~16].png:60"
            halo_mod="~SCALE(150,225)~GS()~CS(150,0,180)"
            auto_vflip=no
            sound=explosion.ogg
        [/frame]
    [/death]
    [healing_anim]
        start_time=-300

        halo1_start_time=-300
        halo1_auto_vflip=false
        [halo1_frame]
            halo="halo/saurian-magic-halo-[1~7].png~O(75%):100"
            halo_mod="~CS(-64,-128,0)"
            halo_y=-15
        [/halo1_frame]

        halo2_start_time=-200
        halo2_auto_vflip=false
        [halo2_frame]
            halo="halo/saurian-magic-halo-[1~7].png~O(75%):100"
            halo_mod="~CS(-64,-128,0)"
            halo_y=-30
        [/halo2_frame]

        halo3_start_time=-100
        halo3_auto_vflip=false
        [halo3_frame]
            halo="halo/saurian-magic-halo-[1~7].png~O(75%):100"
            halo_mod="~CS(-64,-128,0)"
            halo_y=0
        [/halo3_frame]

        [frame]
            duration=100
        [/frame]
        [frame]
            duration=600
        [/frame]
    [/healing_anim]

    [attack]
        name=noctum
        description=_"noctum"
        icon=attacks/darkbeam.png
        type=arcane
        range=ranged
        damage=20
        number=1
        attack_weight=0.0
        defense_weight=0.0
        [specials]
            {WEAPON_SPECIAL_HOPLITE_RANGED spire_fire 5 0 "misc/targethex.png" aoe () () ()}
        [/specials]
    [/attack]
    [attack_anim]
        [filter_attack]
            name=noctum
        [/filter_attack]
        missile_start_time=-400
        missile2_start_time=-325
        missile3_start_time=-250
        missile4_start_time=-175
        missile5_start_time=-100
        [missile_frame]
            halo="halo/darkness-beam-[1~7,6~1].png:[30*6,130,70*6]"
            halo_mod="~O(0.8)"
            halo_y=20
            offset=1.0
            auto_vflip=no
            sound=magic-dark-big.ogg
        [/missile_frame]
        [missile2_frame]
            halo="misc/blank-hex.png:1,halo/darkness-beam-[1~7,6~1].png:[30*6,130,70*6]"
            halo_mod="~O(0.8)"
            halo_y=20
            offset=2.0
            auto_vflip=no
        [/missile2_frame]
        [missile3_frame]
            halo="misc/blank-hex.png:1,halo/darkness-beam-[1~7,6~1].png:[30*6,130,70*6]"
            halo_mod="~O(0.8)"
            halo_y=20
            offset=3.0
            auto_vflip=no
            sound=magic-dark-big.ogg
        [/missile3_frame]
        [missile4_frame]
            halo="misc/blank-hex.png:1,halo/darkness-beam-[1~7,6~1].png:[30*6,130,70*6]"
            halo_mod="~O(0.8)"
            halo_y=20
            offset=4.0
            auto_vflip=no
        [/missile4_frame]
        [missile5_frame]
            halo="misc/blank-hex.png:1,halo/darkness-beam-[1~7,6~1].png:[30*6,130,70*6]"
            halo_mod="~O(0.8)"
            halo_y=20
            offset=5.0
            auto_vflip=no
            sound=magic-dark-big.ogg
        [/missile5_frame]
        start_time=-575
        [frame]
            duration=450
        [/frame]
    [/attack_anim]
[/unit_type]